name: CI # Имя workflow, отображается в GitHub Actions

env: # Глобальные переменные окружения для workflow
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true" # Убирает предупреждение про Node.js 20 (и готовит к смене дефолта)

on: # События, при которых workflow запускается
  push: # Запуск на push (во все ветки, т.к. фильтр branches не задан)
  pull_request: # Запуск на PR (проверка изменений перед мерджем)

jobs: # Набор jobs (условные “этапы” пайплайна)
  tests: # Job с тестами
    runs-on: ubuntu-latest # Runner/VM, где выполняются шаги
    steps: # Шаги внутри job выполняются последовательно
      - uses: actions/checkout@v6 # Клонирует репозиторий в workspace runner'а

      - name: Set up Python # Имя шага (для логов в Actions)
        uses: actions/setup-python@v6 # Устанавливает/выбирает нужную версию Python на runner'е
        with: # Параметры action'а
          python-version: "3.12" # Версия Python для выполнения тестов

      - name: Install dependencies # Установка зависимостей проекта
        run: | # Многострочный shell-скрипт на runner'е
          python -m pip install --upgrade pip # Обновляем pip
          pip install -r requirements.txt # Ставим зависимости из requirements.txt

      - name: Run tests # Запуск тестов
        run: python -m pytest -q # Запуск тестов pytest

